<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健身日记 · 第一期 Demo</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #1a1d24;
      --line: #2a2f3a;
      --text: #e8eaf0;
      --muted: #9aa3b2;
      --accent: #4c9aff;
      --warn: #ffb454;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }
    h1 { font-size: 20px; margin-bottom: 6px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
    .input-row { display: flex; gap: 10px; width: 100%; max-width: 560px; }
    input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
    }
    button {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .card {
      width: 100%;
      max-width: 560px;
      margin-top: 24px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      display: none;
    }
    .card.show { display: block; }
    .card h2 { font-size: 15px; margin-bottom: 14px; color: var(--accent); }
    .row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
    .row:last-of-type { border-bottom: none; }
    .row .k { color: var(--muted); }
    .remind {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255, 180, 84, .12);
      border: 1px solid rgba(255, 180, 84, .3);
      color: var(--warn);
      font-size: 14px;
    }
    .sec { margin-top: 16px; font-size: 14px; }
    .sec h3 { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .stretch { display: flex; gap: 12px; align-items: center; margin: 8px 0; }
    .gif {
      width: 72px; height: 48px; border-radius: 8px;
      background: var(--line);
      color: var(--muted);
      font-size: 11px;
      display: flex; align-items: center; justify-content: center;
      text-align: center;
      overflow: hidden; flex-shrink: 0;
    }
    .gif img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .gif-fallback { line-height: 1.3; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .55; } 50% { opacity: 1; } }
    .status { margin-top: 16px; color: var(--muted); font-size: 13px; }
    .err { color: #ff6b6b; }
    .history { width: 100%; max-width: 560px; margin-top: 32px; }
    .history h2 { font-size: 15px; margin-bottom: 12px; color: var(--muted); }
    .item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .item .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
    .item .part { color: var(--accent); font-weight: 600; }
    .item .feeling { color: var(--muted); margin-top: 4px; }
    .section-label { width: 100%; max-width: 560px; font-size: 13px; color: var(--muted); margin: 28px 0 10px; }
    .plan-tabs { display: flex; gap: 8px; width: 100%; max-width: 560px; margin-bottom: 12px; }
    .tab {
      padding: 8px 16px; border-radius: 20px; cursor: pointer;
      border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 13px;
    }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .plan-row { display: flex; gap: 10px; width: 100%; max-width: 560px; }
    select {
      flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line);
      background: var(--card); color: var(--text); font-size: 14px; font-family: inherit;
    }
    .field-label { align-self: center; color: var(--muted); font-size: 14px; white-space: nowrap; }
    .plan-tip { color: var(--muted); font-size: 13px; margin: 2px 0 6px 0; }
    .cal-head { display: flex; align-items: center; gap: 12px; width: 100%; max-width: 560px; margin-bottom: 10px; }
    .cal-head button {
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--card); color: var(--text); cursor: pointer; font-size: 14px;
    }
    .cal-title { font-size: 15px; flex: 1; text-align: center; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; max-width: 560px; }
    .cal-week { margin-bottom: 4px; color: var(--muted); font-size: 12px; text-align: center; }
    .cal-day {
      position: relative; height: 44px; border-radius: 8px; background: var(--card);
      border: 1px solid var(--line); display: flex; align-items: center; justify-content: center;
      font-size: 14px; cursor: pointer; color: var(--text);
    }
    .cal-day:hover { border-color: var(--accent); }
    .cal-day.today { border-color: var(--accent); }
    .cal-day.sel { background: var(--accent); color: #fff; }
    .cal-day .dot {
      position: absolute; bottom: 6px; width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
    }
    .cal-empty { height: 44px; }
    .day-panel { width: 100%; max-width: 560px; margin-top: 16px; }
    .day-panel h3 { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .timer-row { display: flex; gap: 10px; align-items: center; width: 100%; max-width: 560px; margin-bottom: 12px; flex-wrap: wrap; }
    .timer-btn { padding: 10px 18px; border-radius: 10px; border: none; cursor: pointer; font-size: 14px; color: #fff; }
    .timer-btn.start { background: #2fbf71; }
    .timer-btn.end { background: var(--warn); color: #1a1a1a; }
    .timer-btn:disabled { opacity: .4; cursor: not-allowed; }
    .timer-display { color: var(--text); font-size: 15px; font-weight: 600; }
  </style>
  <style>
    /* Portfolio pass: a calm, editorial dashboard style that keeps the original demo logic intact. */
    :root {
      --bg: #f5f7f3;
      --surface: #ffffff;
      --surface-soft: #edf3ed;
      --line: #dfe7df;
      --text: #17221d;
      --muted: #738078;
      --accent: #176b4c;
      --accent-2: #2f9b70;
      --accent-soft: #e2f1e8;
      --warn: #bd6b26;
      --shadow: 0 18px 50px rgba(38, 67, 51, .08);
      --radius-lg: 24px;
      --radius-md: 16px;
    }
    html { background: var(--bg); }
    body {
      display: block;
      padding: 0 24px 72px;
      color: var(--text);
      background: radial-gradient(circle at 8% 0%, #e7f2e9 0, transparent 33%), var(--bg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    body > * { width: 100%; max-width: 1080px; margin-left: auto; margin-right: auto; }
    .topbar { max-width: 1080px; padding: 26px 0 8px; display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; gap: 11px; align-items: center; font-size: 15px; font-weight: 750; letter-spacing: .02em; }
    .brand-mark { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 11px; background: var(--accent); color: #fff; box-shadow: 0 7px 16px rgba(23,107,76,.2); }
    .topbar-note { color: var(--muted); font-size: 12px; }
    .hero { max-width: 1080px; padding: 54px 0 32px; display: flex; justify-content: space-between; align-items: end; gap: 40px; }
    .hero-copy { max-width: 690px; }
    h1 { margin: 0 0 14px; color: var(--text); font-size: clamp(32px, 5vw, 58px); line-height: 1.06; letter-spacing: -.055em; font-weight: 780; }
    .sub { margin: 0; color: var(--muted); font-size: 16px; line-height: 1.7; }
    .hero-badge { flex-shrink: 0; padding: 11px 14px; border: 1px solid #cde4d4; border-radius: 999px; background: rgba(255,255,255,.62); color: var(--accent); font-size: 12px; font-weight: 700; }
    .workspace-grid { max-width: 1080px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
    .workspace-card { min-width: 0; padding: 23px; border: 1px solid rgba(223,231,223,.82); border-radius: var(--radius-lg); background: rgba(255,255,255,.48); }
    .workspace-card .section-label { margin-top: 0; }
    .workspace-card .plan-tabs, .workspace-card .plan-row, .workspace-card .timer-row, .workspace-card .input-row, .workspace-card .status, .workspace-card .card { width: 100%; }
    .section-label { max-width: 1080px; margin: 34px auto 13px; color: var(--text); font-size: 13px; font-weight: 750; letter-spacing: .01em; }
    .section-label::first-letter { color: var(--accent); }
    .plan-tabs { max-width: 1080px; gap: 8px; margin-bottom: 14px; }
    .tab { padding: 10px 15px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.7); color: var(--muted); font-size: 13px; font-weight: 650; transition: all .2s ease; }
    .tab:hover { border-color: #aacdb8; color: var(--accent); }
    .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); box-shadow: 0 8px 16px rgba(23,107,76,.16); }
    .plan-row { max-width: 1080px; gap: 12px; }
    .field-label { color: var(--muted); font-size: 13px; font-weight: 650; }
    input, select { min-height: 48px; padding: 13px 15px; border: 1px solid var(--line); border-radius: 13px; outline: none; background: rgba(255,255,255,.88); color: var(--text); font-size: 14px; box-shadow: 0 2px 0 rgba(20,50,33,.01); transition: border-color .2s, box-shadow .2s; }
    input:focus, select:focus { border-color: #7db99a; box-shadow: 0 0 0 4px rgba(47,155,112,.12); }
    button { min-height: 48px; padding: 12px 19px; border-radius: 13px; background: var(--accent); font-weight: 700; letter-spacing: .01em; transition: transform .18s ease, box-shadow .18s ease, background .18s ease; }
    button:hover:not(:disabled) { transform: translateY(-1px); background: #0f5a3e; box-shadow: 0 8px 18px rgba(23,107,76,.17); }
    .status { min-height: 22px; max-width: 1080px; margin-top: 10px; color: var(--muted); font-size: 13px; }
    .card { max-width: 1080px; margin-top: 15px; padding: 24px; border: 1px solid var(--line); border-radius: var(--radius-lg); background: rgba(255,255,255,.9); box-shadow: var(--shadow); }
    .card h2 { margin-bottom: 18px; color: var(--text); font-size: 18px; letter-spacing: -.02em; }
    .row { min-height: 42px; padding: 11px 0; border-bottom-color: #e8eee8; font-size: 14px; gap: 18px; }
    .row > span:last-child { text-align: right; }
    .row .k { color: var(--muted); }
    .remind { margin-top: 18px; padding: 14px 15px; border: 1px solid #efd5b2; border-radius: 13px; background: #fff7ed; color: var(--warn); line-height: 1.55; }
    .sec { margin-top: 22px; }
    .sec h3, .day-panel h3 { margin-bottom: 10px; color: var(--muted); font-size: 12px; font-weight: 750; letter-spacing: .08em; text-transform: uppercase; }
    .plan-tip { margin: -3px 0 8px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .timer-row { max-width: 1080px; margin-bottom: 13px; padding: 15px 16px; border: 1px solid var(--line); border-radius: var(--radius-md); background: rgba(255,255,255,.68); }
    .timer-btn { min-height: 42px; padding: 10px 16px; border-radius: 11px; }
    .timer-btn.start { background: var(--accent); }
    .timer-btn.end { background: #f3d5ac; color: #784313; }
    .timer-display { margin-left: auto; color: var(--accent); font-variant-numeric: tabular-nums; }
    .input-row { max-width: 1080px; gap: 12px; }
    .input-row input { min-width: 0; }
    .cal-head { max-width: 1080px; margin: 15px auto 10px; padding: 8px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.68); }
    .cal-head button { min-height: 36px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--text); font-size: 12px; }
    .cal-title { color: var(--text); font-size: 14px; font-weight: 750; }
    .cal-week { max-width: 1080px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 700; }
    .cal-grid { max-width: 1080px; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .cal-day { height: 58px; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.74); color: var(--text); transition: all .18s ease; }
    .cal-day:hover { border-color: #8fc4a6; background: #f5fbf6; }
    .cal-day.today { border-color: #8fc4a6; box-shadow: inset 0 0 0 1px #8fc4a6; }
    .cal-day.sel { border-color: var(--accent); background: var(--accent); box-shadow: 0 7px 14px rgba(23,107,76,.16); }
    .cal-day .dot { bottom: 8px; width: 5px; height: 5px; background: #e8a853; }
    .cal-empty { height: 58px; }
    .day-panel { max-width: 1080px; margin-top: 17px; }
    .item { margin-bottom: 9px; padding: 16px; border: 1px solid var(--line); border-radius: 15px; background: rgba(255,255,255,.76); }
    .item .meta { margin-bottom: 7px; color: var(--muted); font-size: 11px; }
    .item .part { color: var(--accent); font-size: 15px; }
    .item .feeling { line-height: 1.6; }
    .gif { width: 78px; height: 54px; border: 1px solid #d5e4d8; border-radius: 11px; background: var(--surface-soft); }
    .gif-fallback { color: #75a084; font-size: 10px; }
    .err { color: #c15d5d; }
    @media (max-width: 640px) {
      body { padding: 0 16px 48px; }
      .topbar { padding-top: 18px; }
      .topbar-note { display: none; }
      .hero { padding: 42px 0 20px; display: block; }
      h1 { font-size: 40px; }
      .sub { margin-top: 13px; font-size: 14px; }
      .hero-badge { display: inline-block; margin-top: 20px; }
      .workspace-grid { display: block; }
      .workspace-card { padding: 18px; margin-bottom: 16px; }
      .plan-row, .input-row { flex-wrap: wrap; }
      .field-label { width: 38px; }
      .plan-row input, .plan-row select { min-width: 0; width: calc(100% - 50px); }
      .plan-row button { width: 100%; margin-left: 50px; }
      .input-row input, .input-row button { width: 100%; }
      .timer-display { width: 100%; margin: 2px 0 0; }
      .cal-grid, .cal-week { gap: 4px; }
      .cal-day, .cal-empty { height: 45px; border-radius: 10px; font-size: 12px; }
      .cal-day .dot { bottom: 5px; }
      .card { padding: 19px; border-radius: 19px; }
      .row { align-items: flex-start; }
      .row > span:last-child { max-width: 66%; line-height: 1.5; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">✦</span><span>FitLog AI</span></div>
    <div class="topbar-note">Personal training companion · v0.1</div>
  </header>

  <section class="hero">
    <div class="hero-copy">
      <div style="margin-bottom:12px;color:var(--accent);font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase">Training, made personal</div>
      <h1>把每次训练，变成可复盘的成长记录</h1>
      <div class="sub">练前让 AI 帮你做决定，练后用一句话留下记录。<br>你的训练，不该只停留在“今天练了”。</div>
    </div>
    <div class="hero-badge">AI 健身记录 Demo · 第一期</div>
  </section>

  <div class="workspace-grid">
    <section class="workspace-card">
      <div class="section-label">① 练前 · 今天怎么练</div>
      <div class="plan-tabs">
        <button id="tab-ai" class="tab active">AI 帮我选部位</button>
        <button id="tab-self" class="tab">自己选部位</button>
      </div>
      <div class="plan-row">
        <label class="field-label">场景</label>
        <select id="plan-place">
          <option value="商业健身房（器械齐全）">商业健身房（器械齐全）</option>
          <option value="家庭（少量器械）">家庭（少量器械）</option>
          <option value="无器械 / 户外">无器械 / 户外</option>
        </select>
      </div>
      <div class="plan-tip">商业健身房：主训练优先使用器械，热身与拉伸采用徒手动作。</div>
      <div id="part-picker" class="plan-row" style="display:none">
        <label class="field-label">部位</label>
        <select id="plan-part">
          <option>胸</option>
          <option>背</option>
          <option>腿</option>
          <option>臀</option>
          <option>肩</option>
          <option>手臂</option>
          <option>核心</option>
          <option>全身</option>
        </select>
      </div>
      <div class="plan-row">
        <label class="field-label">时长</label>
        <input id="plan-time" type="number" placeholder="分钟，如 60" />
        <button id="plan-go">生成计划</button>
      </div>
      <div id="plan-status" class="status"></div>
      <div id="plan-card" class="card"></div>
    </section>

    <section class="workspace-card">
      <div class="section-label">② 练后 · 记录一下</div>
      <div class="timer-row">
        <button id="start-btn" class="timer-btn start">开始训练</button>
        <button id="end-btn" class="timer-btn end" disabled>结束训练</button>
        <div id="timer-display" class="timer-display">还没开始</div>
      </div>
      <div class="input-row">
        <input id="msg" type="text" placeholder="比如：今天练完背，手臂有点酸，练了40分钟，全都是无氧" />
        <button id="go">生成</button>
      </div>
      <div id="status" class="status"></div>
      <div id="card" class="card"></div>
    </section>
  </div>

  <div class="section-label">③ 回顾 · 健身日历</div>
  <div class="cal-head">
    <button id="cal-prev">‹ 上月</button>
    <div class="cal-title" id="cal-title"></div>
    <button id="cal-next">下月 ›</button>
  </div>
  <div class="cal-week">
    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
  </div>
  <div class="cal-grid" id="cal-grid"></div>
  <div class="day-panel" id="day-panel"></div>

  <script>
    const SYSTEM_PROMPT = `你是一个健身教练助理。用户会用一句话描述刚完成的训练。
请把这句话解析成下面的 JSON 结构，只输出 JSON，不要任何解释：
{
  "部位": "...",
  "时长_分钟": 数字,
  "训练构成": [
    { "类型": "有氧", "时长_分钟": 数字 },
    { "类型": "无氧", "时长_分钟": 数字 }
  ],
  "强度": "低 / 中 / 高 / 未说明",
  "感受": "...",
  "提醒": "...",
  "拉伸建议": [ { "部位": "...", "时长_分钟": 数字 } ],
  "营养建议": "..."
}
规则：
- 用户没说的字段就写"未说明"，不许瞎编。
- 如果时长带秒（如"40 分 30 秒"），把"时长_分钟"换算成带小数的分钟（如 40.5）。
- "训练构成"里有氧 + 无氧的时长加起来要尽量等于"时长_分钟"；用户只提到一个类型时另一个填 0。
- 拉伸建议只针对今天练的部位，以及明显不适的部位。`;

    const PLAN_PROMPT = `你是一个健身教练。用户会告诉你训练场景、今天有多少时间，以及想练哪个部位（有时没指定）。
请生成一份当天的训练计划，只输出 JSON，不要任何解释：
{
  "场景": "...",
  "热身": "...",
  "动作": [
    { "动作名": "...", "器械": "...", "组数": 数字, "次数": "...", "要领": "..." }
  ],
  "提示": "..."
}
规则：
- 如果用户没指定部位，你先根据新手情况和时长推荐一个部位，再围绕它生成计划。
- 动作按训练顺序排列，数量和总时长匹配（约 1 小时 4-6 个动作）。
- 只针对确定的部位，别塞无关部位。
- 先识别训练场景，再决定动作类型：用户选择“商业健身房（器械齐全）”时，主训练动作必须优先使用常见健身房器械或自由重量，包括杠铃、哑铃、史密斯机、龙门架/绳索、坐姿划船机、高位下拉机、胸推机、腿举机、腿屈伸/腿弯举机、臀推机、髋外展机、跑步机、单车或椭圆机等。
- 商业健身房场景下，热身和拉伸可以使用徒手动作；但“动作”数组中的主训练不能全部使用俯卧撑、徒手深蹲、徒手臀桥、平板支撑等无器械动作，除非用户明确要求无器械或说明器械不可用。
- 如果某个器械可能不是每家门店都有，优先选择更常见的器械，并在“提示”里给出一个器械替代方案；不要假设所有门店设备完全一致。
- 针对“臀”，优先考虑杠铃/史密斯臀推、臀推机、绳索后踢、髋外展机、腿举机等；不要只给徒手臀桥。
- “器械”字段必须写明动作使用的器械；热身或拉伸写“徒手/活动度”。
- "要领"写新手最容易做错的一个点，一句话即可。`;

    const btn = document.getElementById("go");
    const input = document.getElementById("msg");
    const status = document.getElementById("status");
    const card = document.getElementById("card");
    const calGrid = document.getElementById("cal-grid");
    const calTitle = document.getElementById("cal-title");
    const dayPanel = document.getElementById("day-panel");

    function toDateKey(d) {
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    }

    async function askAI(systemPrompt, userText) {
      // The browser only talks to our same-origin serverless proxy.
      // The DeepSeek key lives in Vercel Environment Variables, never in this file.
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "deepseek-chat",
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: userText }
          ],
          temperature: 0.3,
          response_format: { type: "json_object" }
        })
      });
      if (!res.ok) {
        const errText = await res.text();
        throw new Error("请求失败：" + res.status + " " + errText.slice(0, 200));
      }
      const data = await res.json();
      const content = data.choices[0].message.content.trim();
      const cleaned = content.replace(/^```json\s*/i, "").replace(/```$/i, "");
      return JSON.parse(cleaned);
    }

    btn.addEventListener("click", run);

    const STORE_KEY = "fitness_diary_records";

    function loadRecords() {
      try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
      catch (e) { return []; }
    }

    function saveRecord(rec) {
      const records = loadRecords();
      records.unshift(rec);
      localStorage.setItem(STORE_KEY, JSON.stringify(records));
      renderCalendar();
    }

    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth();
    let selDate = toDateKey(new Date());

    function recordsByDate() {
      const map = {};
      loadRecords().forEach(r => {
        if (r.date) map[r.date] = (map[r.date] || 0) + 1;
      });
      return map;
    }

    function renderCalendar() {
      const byDate = recordsByDate();
      calTitle.textContent = calYear + " 年 " + (calMonth + 1) + " 月";

      const first = new Date(calYear, calMonth, 1);
      const days = new Date(calYear, calMonth + 1, 0).getDate();
      const start = first.getDay();
      const todayKey = toDateKey(new Date());

      let html = "";
      for (let i = 0; i < start; i++) html += '<span class="cal-empty"></span>';
      for (let d = 1; d <= days; d++) {
        const key = calYear + "-" + String(calMonth + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
        const has = byDate[key];
        const cls = "cal-day" + (key === todayKey ? " today" : "") + (key === selDate ? " sel" : "");
        html += `<span class="${cls}" data-date="${key}">${d}${has ? '<i class="dot"></i>' : ""}</span>`;
      }
      calGrid.innerHTML = html;

      calGrid.querySelectorAll(".cal-day").forEach(el => {
        el.addEventListener("click", () => {
          selDate = el.dataset.date;
          renderCalendar();
        });
      });

      showDay(selDate);
    }

    function showDay(dateKey) {
      if (!dateKey) {
        dayPanel.innerHTML = '<div class="item" style="color:var(--muted)">点上面的某一天，看当天记录。</div>';
        return;
      }
      const records = loadRecords().filter(r => r.date === dateKey);
      if (records.length === 0) {
        dayPanel.innerHTML = '<div class="item" style="color:var(--muted)">' + dateKey + ' 还没有记录。</div>';
        return;
      }
      dayPanel.innerHTML = '<h3>' + dateKey + '</h3>' + records.map(r => {
        const d = r.data;
        const gong = (d.训练构成 || []).map(t => t.类型 + " " + t.时长_分钟 + " 分钟").join("，") || d.类型;
        return `<div class="item">
          <div class="meta">${r.time}</div>
          <div class="part">${d.部位} · ${d.时长_分钟} 分钟</div>
          <div class="feeling">${gong} · 感受：${d.感受}</div>
        </div>`;
      }).join("");
    }

    document.getElementById("cal-prev").addEventListener("click", () => {
      calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
      selDate = null;
      renderCalendar();
    });
    document.getElementById("cal-next").addEventListener("click", () => {
      calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
      selDate = null;
      renderCalendar();
    });

    renderCalendar();

    // ---- 练前计划 ----
    const tabAi = document.getElementById("tab-ai");
    const tabSelf = document.getElementById("tab-self");
    const partPicker = document.getElementById("part-picker");
    const planPart = document.getElementById("plan-part");
    const planPlace = document.getElementById("plan-place");
    const planTime = document.getElementById("plan-time");
    const planGo = document.getElementById("plan-go");
    const planStatus = document.getElementById("plan-status");
    const planCard = document.getElementById("plan-card");

    let planMode = "ai";

    tabAi.addEventListener("click", () => switchPlan("ai"));
    tabSelf.addEventListener("click", () => switchPlan("self"));
    planGo.addEventListener("click", runPlan);

    function switchPlan(mode) {
      planMode = mode;
      const isAi = mode === "ai";
      tabAi.classList.toggle("active", isAi);
      tabSelf.classList.toggle("active", !isAi);
      partPicker.style.display = isAi ? "none" : "flex";
    }

    async function runPlan() {
      const time = planTime.value.trim();
      if (!time) { planStatus.innerHTML = '<span class="err">先填今天练多少分钟。</span>'; return; }

      let text;
      if (planMode === "ai") {
        text = "训练场景：" + planPlace.value + "。今天时长 " + time + " 分钟，请你根据新手情况帮我选一个部位。";
      } else {
        text = "训练场景：" + planPlace.value + "。今天练" + planPart.value + "，时长 " + time + " 分钟。";
      }

      planGo.disabled = true;
      planStatus.textContent = "正在生成计划…";
      planCard.classList.remove("show");

      try {
        let p = await askAI(PLAN_PROMPT, text);
        // Badcase guard: if a gym plan comes back mostly bodyweight-only,
        // ask the model once more with the violated constraint made explicit.
        if (needsEquipmentRetry(p, planPlace.value)) {
          planStatus.textContent = "正在校正器械训练动作…";
          p = await askAI(PLAN_PROMPT, text + " 上一次计划没有满足商业健身房器械约束，请重新生成：主训练动作至少 60% 使用常见器械或自由重量，并为每个动作填写器械字段；徒手动作只放在热身或拉伸。 ");
        }
        renderPlan(p);
        planStatus.textContent = "✅ 计划已生成";
      } catch (e) {
        planStatus.innerHTML = '<span class="err">出错：' + e.message + "</span>";
      } finally {
        planGo.disabled = false;
      }
    }

    function needsEquipmentRetry(plan, place) {
      if (!place.includes("商业健身房")) return false;
      const moves = Array.isArray(plan && plan.动作) ? plan.动作 : [];
      if (moves.length === 0) return true;
      const equipmentMoves = moves.filter(m => {
        const tool = String(m.器械 || "");
        return tool && !/(徒手|无器械|活动度)/.test(tool);
      });
      return equipmentMoves.length < Math.max(2, Math.ceil(moves.length * 0.6));
    }

    function renderPlan(p) {
      const moves = (p.动作 || []).map((m, i) =>
        `<div class="row"><span class="k">${i + 1}. ${m.动作名}${m.器械 ? ` <small style="color:var(--accent)">· ${m.器械}</small>` : ""}</span><span>${m.组数} 组 × ${m.次数}</span></div>
         ${m.要领 ? `<div class="plan-tip">· ${m.要领}</div>` : ""}`).join("");
      planCard.innerHTML = `
        <h2>今日训练计划</h2>
        ${p.场景 ? `<div class="row"><span class="k">训练场景</span><span>${p.场景}</span></div>` : ""}
        <div class="row"><span class="k">热身</span><span>${p.热身}</span></div>
        <div class="sec"><h3>动作</h3>${moves}</div>
        ${p.提示 ? `<div class="remind">💡 ${p.提示}</div>` : ""}
      `;
      planCard.classList.add("show");
    }

    // ---- 训练计时 ----
    const startBtn = document.getElementById("start-btn");
    const endBtn = document.getElementById("end-btn");
    const timerDisplay = document.getElementById("timer-display");
    const SESSION_KEY = "fitness_session_start";
    const DURATION_KEY = "fitness_last_duration";
    let ticker = null;

    function formatElapsed(ms) {
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return h + ":" + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
      return m + ":" + String(sec).padStart(2, "0");
    }

    function formatSeconds(sec) {
      const h = Math.floor(sec / 3600);
      const m = Math.floor((sec % 3600) / 60);
      const s = sec % 60;
      if (h > 0) return h + " 小时 " + m + " 分 " + s + " 秒";
      if (m > 0) return m + " 分 " + s + " 秒";
      return s + " 秒";
    }

    function renderTimer() {
      const start = Number(localStorage.getItem(SESSION_KEY));
      if (start) {
        startBtn.disabled = true;
        endBtn.disabled = false;
        timerDisplay.textContent = "已训练 " + formatElapsed(Date.now() - start);
        if (!ticker) ticker = setInterval(renderTimer, 1000);
      } else {
        startBtn.disabled = false;
        endBtn.disabled = true;
        if (ticker) { clearInterval(ticker); ticker = null; }
        const last = Number(localStorage.getItem(DURATION_KEY));
        timerDisplay.textContent = last ? "上次训练 " + formatSeconds(last) : "还没开始";
      }
    }

    startBtn.addEventListener("click", () => {
      localStorage.setItem(SESSION_KEY, String(Date.now()));
      localStorage.removeItem(DURATION_KEY);
      renderTimer();
    });

    endBtn.addEventListener("click", () => {
      const start = Number(localStorage.getItem(SESSION_KEY));
      if (!start) return;
      const totalSec = Math.max(1, Math.round((Date.now() - start) / 1000));
      localStorage.removeItem(SESSION_KEY);
      localStorage.setItem(DURATION_KEY, String(totalSec));
      renderTimer();
    });

    renderTimer();

    async function run() {
      let text = input.value.trim();
      if (!text) { status.innerHTML = '<span class="err">先输入一句话再点生成。</span>'; return; }

      const lastDur = localStorage.getItem(DURATION_KEY);
      if (lastDur) {
        text = text + "（本次实际训练约 " + formatSeconds(Number(lastDur)) + "）";
        localStorage.removeItem(DURATION_KEY);
        renderTimer();
      }

      btn.disabled = true;
      status.textContent = "正在生成…";
      card.classList.remove("show");

      try {
        const parsed = await askAI(SYSTEM_PROMPT, text);
        render(parsed);
        saveRecord({ date: toDateKey(new Date()), time: new Date().toLocaleString(), input: text, data: parsed });
        status.textContent = "✅ 已保存";
      } catch (e) {
        status.innerHTML = '<span class="err">出错：' + e.message + "</span>";
      } finally {
        btn.disabled = false;
      }
    }

    const STRETCH_GIFS = {
      // 部位 -> 动图地址。去 giphy.com 或百度搜"XX 拉伸 gif"，右键复制图片链接填进来，例如：
      // "肱二头肌": "https://media.giphy.com/media/xxxx/giphy.gif",
    };

    function render(d) {
      const gong = (d.训练构成 || []).map(t => t.类型 + " " + t.时长_分钟 + " 分钟").join("，") || d.类型;
      const stretch = (d.拉伸建议 || []).map(s => {
        const url = STRETCH_GIFS[s.部位];
        const inner = url
          ? `<img src="${url}" alt="${s.部位}">`
          : `<div class="gif-fallback">动图待补</div>`;
        return `<div class="stretch">
          <div class="gif">${inner}</div>
          <div><strong>${s.部位}</strong> · 约 ${s.时长_分钟} 分钟</div>
        </div>`;
      }).join("");

      card.innerHTML = `
        <h2>今日训练记录</h2>
        <div class="row"><span class="k">部位</span><span>${d.部位}</span></div>
        <div class="row"><span class="k">总时长</span><span>${d.时长_分钟} 分钟</span></div>
        <div class="row"><span class="k">类型构成</span><span>${gong}</span></div>
        <div class="row"><span class="k">强度</span><span>${d.强度}</span></div>
        <div class="row"><span class="k">感受</span><span>${d.感受}</span></div>
        ${d.提醒 && d.提醒 !== "无" ? `<div class="remind">💡 ${d.提醒}</div>` : ""}
        <div class="sec"><h3>拉伸建议</h3>${stretch}</div>
        <div class="sec"><h3>营养建议</h3><div>${d.营养建议}</div></div>
      `;
      card.classList.add("show");
    }
  </script>
</body>
</html>
